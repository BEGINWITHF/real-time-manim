name: Suggestion
description: Suggest an improvement to existing behavior, workflow, or usability
title: "[Suggestion] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template to suggest an improvement to something that already exists. For a brand-new capability, use **Feature request** instead.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: I am lazy to check
          required: false

  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: What would you improve?
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why is this useful?
      description: Describe the current pain point and who benefits.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If you have a concrete design in mind, describe it here.
      render: python
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Rendering / Vulkan
        - Animation API
        - Recording / export
        - Text / LaTeX / Typst
        - Packaging / installation
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List any workarounds or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, related issues, or references.
    validations:
      required: false
