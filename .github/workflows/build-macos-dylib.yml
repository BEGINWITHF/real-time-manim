name: build-macos-dylib

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-macos-dylib.yml"
      - "native/**"

jobs:
  build:
    # arm64. macos-14 has been retired from the hosted pool; macos-15 is the
    # oldest remaining Apple-silicon image with the current Xcode/SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install MoltenVK and Vulkan headers
        run: |
          brew install molten-vk vulkan-headers

      - name: Build vulkan_core.dylib
        run: bash native/build_mac.sh

      - name: Verify the mesh pipeline is exported
        run: |
          set -e
          file dist/release/vulkan_core.dylib
          nm -gU dist/release/vulkan_core.dylib | grep -E " _AddMesh$| _Vulkan_GetReadbackSize$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _AddMesh$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _AddMeshIndexed$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _SetPost$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _AddImageQuad$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _AddLineStripF$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _SaveScreenshotRawBGRA$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _SaveScreenshotSlotBGRA$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _SetBackgroundColor$"
          nm -gU dist/release/vulkan_core.dylib | grep -q " _Vulkan_SetUnpaced$"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-core-dylib
          path: dist/release/vulkan_core.dylib
          if-no-files-found: error

      # The mac wheel cannot be built on the Windows dev box, so the release
      # needs this runner for it.  Stage the just-built dylib into the package
      # (setup.py drops the Windows DLL from a darwin wheel) and assert the
      # tag/content, so a release can upload the artifact as-is.
      - name: Build the macOS wheel
        run: |
          set -e
          cp dist/release/vulkan_core.dylib real_time_manim/vulkan_core.dylib
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/wheel
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/wheel/*.whl")[0]
          print("wheel:", whl)
          assert "macosx_12_0_arm64" in whl, whl
          names = zipfile.ZipFile(whl).namelist()
          assert "real_time_manim/vulkan_core.dylib" in names, names
          assert "real_time_manim/vulkan_core.dll" not in names
          PY

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: macos-wheel
          path: dist/wheel/*.whl
          if-no-files-found: error
