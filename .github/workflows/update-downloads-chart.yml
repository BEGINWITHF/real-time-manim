name: update-downloads-chart

on:
  schedule:
    # 00:00 GMT (UTC).
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      smoke_test:
        # Pushes a throwaway commit to refs/heads/chart-ci-smoke, proving the
        # token can write, without touching the default branch.
        description: "Check the commit/push path only (no chart update)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-downloads-chart
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate the chart
        run: python scripts/plot_downloads.py
      - name: Smoke-test the push path
        if: inputs.smoke_test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "run $GITHUB_RUN_ID" > .github/chart-smoke.txt
          git add .github/chart-smoke.txt
          git commit -m "chore: chart workflow smoke test [skip ci]"
          git push --force origin "HEAD:refs/heads/chart-ci-smoke"
      - name: Commit if the chart changed
        if: ${{ !inputs.smoke_test }}
        run: |
          if git diff --quiet -- assets/pypi-downloads.svg; then
            echo "chart unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pypi-downloads.svg
          git commit -m "chore: refresh PyPI downloads chart [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}" \
            || { git pull --rebase --autostash; git push origin "HEAD:${{ github.event.repository.default_branch }}"; }
