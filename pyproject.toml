[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-manim"
version = "1.0.1"
description = "Vulkan-accelerated real-time rendering backend for ManimCE (Windows & macOS)"
readme = "PYPI_README.md"
license = { text = "MIT" }
authors = [{ name = "Tagin T" }]
keywords = ["manim", "vulkan", "renderer", "animation", "gpu"]
requires-python = ">=3.11"
dependencies = [
    "manim>=0.20.0",
    "numpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Homepage = "https://github.com/BEGINWITHF/real-time-manim"
Documentation = "https://github.com/BEGINWITHF/real-time-manim#readme"
Source = "https://github.com/BEGINWITHF/real-time-manim"

[tool.setuptools]
packages = [
    "real_time_manim",
    "real_time_manim.animations",
    "real_time_manim.utils",
]

[tool.setuptools.package-data]
real_time_manim = ["vulkan_core.dll", "logo.ico"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc"]
